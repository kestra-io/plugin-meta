id: whatsapp-custom-fields
namespace: io.kestra.tests

inputs:
  - id: url
    type: STRING
    defaults: "http://localhost:59443"

tasks:
  - id: whatsapp-custom-fields
    type: io.kestra.plugin.meta.whatsapp.WhatsAppExecution
    url: "{{ inputs.url }}/webhook-unit-test"
    whatsAppIds:
      - "some waId"
      - "someId"
    from: "some phone number"
    customMessage: "Custom WhatsApp regression message"
    customFields:
      Environment: "test"
      Component: "plugin-meta"
    profileName: "MyProfile"
    executionId: "{{trigger.executionId}}"

triggers:
  - id: on_failure
    type: io.kestra.plugin.core.trigger.Flow
    preconditions:
      id: flow_trigger
      flows:
        - namespace: io.kestra.tests
          flowId: main-flow-that-fails
          states: [ FAILED ]
